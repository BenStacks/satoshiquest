[project]
name = 'contract'
description = ''
authors = []
telemetry = true
cache_dir = './.cache'

# sBTC token requirement - only need sbtc-token per documentation
# Adding sbtc-token automatically includes sbtc-registry and sbtc-deposit
[[project.requirements]]
contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token'
[contracts.satoshi-quest-core]
path = 'contracts/satoshi-quest-core.clar'
clarity_version = 3
epoch = 3.0

[contracts.satoshi-quest-loot]
path = 'contracts/satoshi-quest-loot.clar'
clarity_version = 3
epoch = 3.0

[contracts.satoshi-quest-resurrection]
path = 'contracts/satoshi-quest-resurrection.clar'
clarity_version = 3
epoch = 3.0

[contracts.satoshi-quest-tombstone]
path = 'contracts/satoshi-quest-tombstone.clar'
clarity_version = 3
epoch = 3.0

[contracts.random-oracle]
path = 'contracts/random-oracle.clar'
clarity_version = 3
epoch = 3.0
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
